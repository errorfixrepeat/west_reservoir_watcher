name: Deploy Bot to Fly.io

on:
  push:
    branches: [feat/gh-pages]
    paths: [bot.py, requirements.txt, Dockerfile, fly.toml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if it doesn't exist
        run: fly apps create west-reservoir-bot || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set secrets
        run: |
          fly secrets set \
            TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
            TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}" \
            MY_WHATSAPP_NUMBER="${{ secrets.MY_WHATSAPP_NUMBER }}" \
            --app west-reservoir-bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: fly deploy --remote-only --app west-reservoir-bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
