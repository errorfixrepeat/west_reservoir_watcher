<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>West Reservoir Watcher</title>

  <!-- React + Babel via CDN — no npm/Node required -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #e8f4fd;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2rem;
      max-width: 520px;
      width: 100%;
    }

    h1 { font-size: 1.5rem; font-weight: 700; color: #1a56a4; }
    .subtitle { color: #718096; font-size: 0.9rem; margin-top: 0.25rem; margin-bottom: 1.75rem; }

    label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 0.4rem; }

    input[type="date"] {
      width: 100%;
      padding: 0.55rem 0.8rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      color: #2d3748;
      outline: none;
    }
    input[type="date"]:focus { border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,0.2); }

    .btn-row { display: flex; gap: 0.6rem; margin-top: 0.75rem; }

    .btn {
      padding: 0.45rem 1rem;
      background: #ebf4ff;
      border: 1px solid #bee3f8;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #2b6cb0;
      font-weight: 600;
    }
    .btn:hover { background: #bee3f8; }

    .notif-row { margin-top: 1rem; }
    .notif-btn {
      font-size: 0.82rem;
      color: #718096;
      background: none;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
    }
    .notif-btn:hover { background: #f7fafc; }
    .notif-ok { font-size: 0.82rem; color: #38a169; }

    .times-box {
      margin-top: 1.75rem;
      padding: 1.1rem;
      background: #f7fafc;
      border-radius: 10px;
      border-left: 4px solid #4299e1;
    }
    .times-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.6rem;
    }
    .times-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .time-chip {
      background: #ebf8ff;
      color: #2b6cb0;
      padding: 0.3rem 0.85rem;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 700;
    }
    .no-times { color: #a0aec0; font-style: italic; font-size: 0.9rem; }

    .info-box {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      background: #fffff0;
      border-radius: 8px;
      border-left: 4px solid #ecc94b;
      color: #744210;
      font-size: 0.88rem;
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #a0aec0;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .pulse-row { display: flex; align-items: center; gap: 0.4rem; }
    .pulse {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #68d391;
      flex-shrink: 0;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    function todayISO() {
      return new Date().toISOString().split('T')[0];
    }

    function getLondonTime() {
      return new Date().toLocaleTimeString('en-GB', {
        timeZone: 'Europe/London',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    // Register service worker (required for notifications on mobile Chrome)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    function playDing() {
      const audio = new Audio(
        'https://www.orangefreesounds.com/wp-content/uploads/2022/04/Small-bell-ringing-short-sound-effect.mp3'
      );
      audio.play().catch(() => {});
    }

    async function sendBrowserNotification(newTimes) {
      if (Notification.permission !== 'granted') return;
      const opts = {
        body: `New slot${newTimes.length > 1 ? 's' : ''} available: ${newTimes.join(', ')}`,
        icon: 'https://bookings.better.org.uk/favicon.ico',
      };
      try {
        // Desktop browsers support this directly
        new Notification('West Reservoir Watcher', opts);
      } catch {
        // Mobile Chrome requires going via the service worker
        const reg = await navigator.serviceWorker?.ready;
        reg?.showNotification('West Reservoir Watcher', opts);
      }
    }

    const WORKER_URL = 'https://snowy-hat-1ef4.colmsjunk.workers.dev';

    function App() {
      const [date, setDate] = useState(todayISO());
      const [times, setTimes] = useState([]);
      const [lastUpdate, setLastUpdate] = useState(null);
      const [fetchError, setFetchError] = useState(null);
      const [alertsOn, setAlertsOn] = useState(true);
      const [notifPerm, setNotifPerm] = useState(
        'Notification' in window ? Notification.permission : 'unsupported'
      );
      const knownTimes = useRef(new Set());

      const requestNotifications = async () => {
        if (!('Notification' in window)) return;
        const result = await Notification.requestPermission();
        setNotifPerm(result);
      };

      const fetchSlots = useCallback(async (selectedDate, alerts) => {
        setFetchError(null);
        try {
          const res = await fetch(`${WORKER_URL}?date=${selectedDate}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const json = await res.json();
          let items = json.data;
          if (!Array.isArray(items)) items = Object.values(items);

          const available = items
            .filter(item => item.action_to_show?.status != null)
            .map(item => item.starts_at.format_24_hour)
            .sort();

          const newOnes = available.filter(t => !knownTimes.current.has(t));
          if (newOnes.length > 0 && alerts) {
            playDing();
            sendBrowserNotification(newOnes);
          }

          knownTimes.current = new Set(available);
          setTimes(available);
          setLastUpdate(getLondonTime());
        } catch (err) {
          setFetchError(`Error: ${err.message}`);
        }
      }, []);

      // alertsOnRef lets the interval always see the latest alertsOn value
      const alertsOnRef = useRef(alertsOn);
      useEffect(() => { alertsOnRef.current = alertsOn; }, [alertsOn]);

      useEffect(() => {
        fetchSlots(date, alertsOnRef.current);
        const id = setInterval(() => fetchSlots(date, alertsOnRef.current), 20_000);
        return () => clearInterval(id);
      }, [date, fetchSlots]);

      function handleDateChange(e) {
        knownTimes.current = new Set();
        setTimes([]);
        setDate(e.target.value);
      }

      return (
        <div className="card">
          <h1>West Reservoir Watcher</h1>
          <p className="subtitle">Open water swimming · live, refreshes every 20 seconds</p>

          <label htmlFor="date">Select date</label>
          <input type="date" id="date" value={date} onChange={handleDateChange} />

          <div className="btn-row">
            <button className="btn" onClick={() => fetchSlots(date, alertsOnRef.current)}>Check now</button>
          </div>

          <div className="notif-row">
            {notifPerm === 'granted' ? (
              <button
                className="notif-btn"
                onClick={() => setAlertsOn(v => !v)}
                style={{ color: alertsOn ? '#2b6cb0' : '#a0aec0' }}
              >
                {alertsOn ? '🔔 Alerts on' : '🔕 Alerts off'}
              </button>
            ) : notifPerm === 'unsupported' ? null : (
              <button className="notif-btn" onClick={requestNotifications}>
                🔔 Enable browser notifications
              </button>
            )}
          </div>

          <div className="times-box">
            <div className="times-title">Available slots</div>
            {times.length > 0 ? (
              <div className="times-list">
                {times.map(t => <span key={t} className="time-chip">{t}</span>)}
              </div>
            ) : (
              <span className="no-times">No available slots found</span>
            )}
          </div>

          {fetchError && (
            <div className="info-box" style={{ borderColor: '#fc8181', background: '#fff5f5', color: '#c53030' }}>
              {fetchError}
            </div>
          )}

          <div className="footer">
            {lastUpdate && (
              <div className="pulse-row">
                <span className="pulse" />
                Last refreshed: {lastUpdate} (London time)
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
